# Posts each live site's river reading to Arc once a day and publishes the raw
# GloFAS response it hashed, so anyone can check the fingerprint on-chain.
name: Daily river reading

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The reporter needs only ethers; installing the whole site would pull in packages for other platforms.
      - name: Install ethers
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps && npm init -y > /dev/null && npm install --ignore-scripts --no-audit --no-fund ethers@6.17.0
          ln -s /tmp/deps/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Post today's reading and settle ready ones
        run: node scripts/report.mjs arc-testnet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
      - name: Publish the raw river data
        run: |
          git config user.name "omi-reporter"
          git config user.email "omi-reporter@users.noreply.github.com"
          git add data/readings
          git diff --cached --quiet || { git commit -m "Daily river reading $(date -u +%F)" && git push; }
